events {}

http {
    server {
        listen 80;

        location = /chat/completions {
            proxy_pass http://gateway:9501;
        }

        location / {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_pass laravel:9000;
        }
    }
}
