# Versão inicial: tudo no Laravel, inclusive o /chat/completions (com sleep(2)).
# Limites do desafio, somando os serviços: 1 vCPU e 512 MB, no núcleo 0.
# Workers: 4 do PHP-FPM.

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    # o nginx procura o Laravel ao iniciar
    depends_on:
      - laravel
    cpuset: "0"
    cpus: 0.1
    mem_limit: 64m

  laravel:
    build:
      context: ..
      dockerfile: docker/laravel.Dockerfile
    environment:
      DB_DATABASE: /dados/banco.sqlite
      # a chave recém-criada passa num cookie cifrado, não no banco
      SESSION_DRIVER: cookie
    volumes:
      - ./php-fpm.conf:/usr/local/etc/php-fpm.d/zz-desafio.conf:ro
      - dados:/dados
    cpuset: "0"
    cpus: 0.9
    mem_limit: 448m

volumes:
  dados:
