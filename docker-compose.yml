# Limites do desafio, somando os serviços: 1 vCPU e 512 MB, no núcleo 0.
# Workers: 1 do PHP-FPM (tela) + 1 do gateway.

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    cpuset: "0"
    cpus: 0.1
    mem_limit: 64m

  laravel:
    build:
      context: .
      dockerfile: docker/laravel.Dockerfile
    environment:
      DB_DATABASE: /dados/banco.sqlite
    volumes:
      - dados:/dados
    cpuset: "0"
    cpus: 0.1
    mem_limit: 96m

  gateway:
    image: phpswoole/swoole:6.2.3-php8.4-alpine
    command: php /gateway/servidor.php
    environment:
      DB_DATABASE: /dados/banco.sqlite
    volumes:
      - ./gateway:/gateway:ro
      - dados:/dados
    cpuset: "0"
    cpus: 0.8
    mem_limit: 352m

volumes:
  dados:
