events {}

http {
    server {
        listen 80;

        # o chat vai para o gateway Swoole
        location = /chat/completions {
            proxy_pass http://gateway:9501;
        }

        # qualquer outro caminho de chat não existe (o Laravel não atende mais o chat)
        location /chat/ {
            return 404;
        }

        # o resto (a tela de chaves) vai para o Laravel
        location / {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_pass laravel:9000;
        }
    }
}
